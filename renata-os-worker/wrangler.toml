name = "renata-os-worker"
main = "src/index.js"
compatibility_date = "2024-11-01"

# Restrict which site is allowed to call this Worker.
# Update this if your GitHub Pages URL changes.
[vars]
ALLOWED_ORIGIN = "https://rclsampaio-jpg.github.io"
SUPPORT_EMAIL = "manifestandomagicasuporte@gmail.com"
SUPABASE_URL = "https://iedkwbborimdhphbzwhl.supabase.co"
SUPABASE_ANON_KEY = "sb_publishable_6skldo-YC1gPMPAUBZPDiQ_6sq5v9PI"

# GEMINI_API_KEY e RESEND_API_KEY são secrets, não vars — nunca ficam
# neste arquivo nem no git. Já configurados no Cloudflare; se precisar
# reconfigurar, rode (a partir desta pasta):
#
#   npx wrangler secret put GEMINI_API_KEY
#   npx wrangler secret put RESEND_API_KEY
#
# Decisão deliberada: o Worker chama o Gemini direto (não via OpenRouter)
# por enquanto, pra adiar o custo/setup da OpenRouter até o app estar mais
# maduro. Trocar de volta pra OpenRouter é uma troca isolada dentro de
# src/index.js (callGemini/getAIReply), sem mexer em auth/memória/prompt.

# Permite `import conteudo from './arquivo.md'` retornando o texto puro do
# arquivo como string, resolvido em build-time pelo bundler do Wrangler —
# não é leitura de arquivo em runtime (o Worker roda num V8 isolate, sem
# acesso a filesystem). Usado para injetar os frameworks de referencias/
# no system prompt sem precisar colar o conteúdo dentro de src/index.js.
[[rules]]
type = "Text"
globs = ["**/*.md"]
fallthrough = true
